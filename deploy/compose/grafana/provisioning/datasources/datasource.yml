# Grafana datasource provisioning (ADR-0001 §15.7: "no datasource other than
# the local Prometheus"). URL is 127.0.0.1 because grafana runs with
# network_mode: host, same reasoning as prometheus.yml -- see
# docker-compose.yml.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
