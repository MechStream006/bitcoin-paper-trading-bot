# Prometheus config for the BTC bot observability stack (ADR-0001 Phase 3).
#
# All targets are 127.0.0.1 because prometheus runs with network_mode: host
# (see docker-compose.yml for why -- the btcbot metrics exporter is
# hardcoded to bind 127.0.0.1 only per Phase 2, and a bridge-networked
# container cannot reach a strictly-loopback-bound host service; host
# networking is the only topology where "127.0.0.1" means the same
# loopback for both the host process and this container).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: btcbot

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: btcbot
    static_configs:
      - targets: ['127.0.0.1:9108']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
