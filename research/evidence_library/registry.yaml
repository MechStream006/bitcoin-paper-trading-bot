h6_funding_vol_regime:
  display_name: "H6 Funding x Vol x Regime"
  hypothesis: "Medium-vol + low-funding + non-bear market precedes positive BTC drift."
  direction: long
  rationale: >
    Low perp funding marks absent crowded longs; medium vol avoids both sleepy low-vol
    regimes and panic high-vol regimes; SMA200 gate prevents bear-market entries.
  mechanism: positioning/carry
  data_source: "spot 1m + funding (Binance/CCXT)"
  feature_def: "long when vol_regime==medium AND funding_regime==low AND market_regime != bear; 7-day hold"
  group: "Seed (validated)"
  state: candidate
  state_since: "2026-06-13"
  state_reason: >
    Passes Edge-Candidate gate: Sharpe 0.90 ≥ 0.30, WF 2/3=67% ≥ 50%,
    Sens 100% ≥ 60%, LOO 100% ≥ 67%, break-even 100bps ≥ 15bps, structural ✓.
    Pre-registration exists; live-forward collection active.
  role:
    - edge
  provenance: offline-corpus
  pinned_run: 6b29cb25-d5c0-458a-913b-de714344802b
  preregistration:
    path: "research/forward_evidence/pre_registration.json"
    hash: "f78f0a52bfcd8add023222958a54dcf1f4359e11d76680dd211a6ded72c78aff"
  weaknesses:
